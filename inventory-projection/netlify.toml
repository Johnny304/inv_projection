# Inventory Projection — Netlify static snapshot
# Build + deploy from your PC (DEPLOY_NETLIFY.bat). Do not build on Netlify cloud.

[build]
  publish = "netlify_dist"
  # Skip CI/git builds; publish folder is produced locally with real data/.
  ignore = "exit 0"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*.bin.gz"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Encoding = "identity"

# Existing files under /data and /static win (no force). Catch-all last.
[[redirects]]
  from = "/data/*"
  to = "/data/:splat"
  status = 200

[[redirects]]
  from = "/static/*"
  to = "/static/:splat"
  status = 200

[[redirects]]
  from = "/docs/*"
  to = "/docs/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
